name: Weekly password

# Every Monday the ledger gets a new weekly password. GitHub's clock is UTC
# and can run late, so this wakes hourly on Monday mornings and the script
# changes the password once, on the first run after 08:00 Zagreb time
# (summer or winter). "Run workflow" on the Actions tab changes it right now.
on:
  schedule:
    - cron: "7 5-11 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-password
  cancel-in-progress: false

jobs:
  change:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: New weekly password
        env:
          LEDGER_KEY: ${{ secrets.LEDGER_KEY }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          git config user.name "Poker Night Ledger"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The app may save a result at the same moment — if the push is
          # refused, start again from the newest ledger.
          for attempt in 1 2 3; do
            git fetch --quiet origin "$GITHUB_REF_NAME"
            git reset --quiet --hard "origin/$GITHUB_REF_NAME"
            node .github/scripts/rotate.mjs
            if git diff --quiet -- data.json; then exit 0; fi
            git commit --quiet -m "New weekly password" -- data.json
            if git push --quiet origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            sleep $((attempt * 5))
          done
          echo "::error::Couldn't save the new password after 3 tries. The old password still works."
          exit 1
